services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: occj
      POSTGRES_PASSWORD: occj
      POSTGRES_DB: occj
    ports:
      - "5432:5432"
    volumes:
      - occj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occj"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://occj:occj@postgres:5432/occj
      JWT_SECRET: local-compose-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      # Set these to enable real integrations; unset = deterministic mock/
      # template fallbacks, per the design in backend/app/config.py.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
      FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
      FRESHSERVICE_DOMAIN: ${FRESHSERVICE_DOMAIN:-}
      FRESHSERVICE_API_KEY: ${FRESHSERVICE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  occj_postgres_data:
